<div class="stats" aria-label="Counts">
  <a class="stat" href="{% url 'ui-alert-list' %}">
    <span class="stat-n">{{ counts.alerts_unlinked }}</span>
    <span class="stat-l">Alerts waiting</span>
  </a>
  <a class="stat" href="{% url 'ui-case-list' %}">
    <span class="stat-n">{{ counts.cases_open }}</span>
    <span class="stat-l">Cases open</span>
  </a>
  <a class="stat" href="{% url 'ui-case-list' %}?closed=1">
    <span class="stat-n">{{ counts.cases_total }}</span>
    <span class="stat-l">Cases total</span>
  </a>
  <a class="stat {% if counts.runs_failed %}stat-alarm{% endif %}" href="{% url 'ui-automation-list' %}">
    <span class="stat-n">{{ counts.runs_total }}</span>
    <span class="stat-l">Automation runs</span>
    {% if counts.runs_failed %}<span class="stat-sub">{{ counts.runs_failed }} failed{% endif %}</span>
  </a>
</div>
