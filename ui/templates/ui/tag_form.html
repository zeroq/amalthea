{% extends "ui/base.html" %}
{% load static %}

{% block heading %}New Tag{% endblock %}

{% block actions %}
<a class="btn" href="{% url 'ui-tag-list' %}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}

    <div class="meta-inline">
      <label for="id_name">Name</label>
      <input type="text" id="id_name" name="name" maxlength="100" required autofocus>
    </div>

    <div class="meta-inline">
      <label for="id_colour">Colour</label>
      <input type="text" id="id_colour" name="colour" maxlength="20" placeholder="#e8560a">
    </div>

    <div class="meta-inline">
      <label for="id_description">Description</label>
      <textarea id="id_description" name="description" rows="4"></textarea>
    </div>

    <button class="btn btn-primary" type="submit">Create</button>
    <a class="btn" href="{% url 'ui-tag-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
