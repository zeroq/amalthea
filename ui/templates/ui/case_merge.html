{% extends "ui/base.html" %}
{% load static %}

{% block title %}Merge Case {{ case.number }} — Amalthea{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-white">Merge Case <span class="font-mono text-slate-400">#{{ case.number }}</span></h1>
    <a href="{% url 'ui-case-detail' case_id=case.number %}" class="btn-secondary">Back to Case</a>
  </div>

  <form method="post" class="space-y-6">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium text-slate-300 mb-2">Target Case</label>
      <select name="target_case" class="w-full input-dark" required>
        <option value="">Select target case to merge into</option>
        {% for candidate in candidates %}
          <option value="{{ candidate.id }}">#{{ candidate.number }} — {{ candidate.title }}</option>
        {% empty %}
          <option value="" disabled>No open cases available to merge into</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex justify-end space-x-3">
      <a href="{% url 'ui-case-detail' case_id=case.number %}" class="btn-secondary">Cancel</a>
      <button type="submit" class="btn-danger">Merge Cases</button>
    </div>
  </form>
</div>
{% endblock %}
