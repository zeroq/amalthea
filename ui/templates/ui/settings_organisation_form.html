{% extends "ui/base.html" %}
{% load static %}

{% block heading %}{% if mode == "edit" %}Edit{% else %}New{% endif %} organisation{% endblock %}

{% block actions %}
<a class="btn" href="{% url 'ui-settings-organisations' %}">Back</a>
{% endblock %}

{% block content %}
<div class="card">
  <form method="post" class="stack">
    {% csrf_token %}

    <div class="meta-inline">
      <label for="id_name">Name</label>
      <input type="text" id="id_name" name="name" value="{{ org.name }}" maxlength="200" required autofocus>
    </div>

    <div class="meta-inline">
      <label for="id_description">Description</label>
      <textarea id="id_description" name="description" rows="3">{{ org.description }}</textarea>
    </div>

    <button class="btn btn-primary" type="submit">{% if mode == "edit" %}Update{% else %}Create{% endif %}</button>
    <a class="btn" href="{% url 'ui-settings-organisations' %}">Cancel</a>
  </form>
</div>
{% endblock %}
