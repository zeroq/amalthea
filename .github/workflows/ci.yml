# Amalthea fast CI gate.
#
# Every job is capped at five minutes. CI is a pre-merge smoke gate, not the
# full suite: the full suite, Postgres conformance run and coverage run are
# too slow for a 5-minute budget and remain local/manual gates. Step names and
# Makefile help deliberately do not claim otherwise.
#
# Two independent jobs:
#   * verify  — install pinned closure, static checks, and a fast conformance subset;
#   * secrets — full-history secret scan from a full clone.
#
# The full-history scanner skips legacy dependency/cache blobs (.venv,
# node_modules, __pycache__, *.pyc) so the authoritative secret check finishes
# within the five-minute budget. Current tracked files and all source/config history are still
# scanned.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fast verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pinned closure (hash-verified)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements/dev.txt

      - name: Static checks + fast conformance smoke
        run: make check-ci

      - name: Lock-currentness gate
        run: ./scripts/lock.sh --check

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Full-history scan (local scanner, authoritative)
        run: bash scripts/secret-scan.sh --history
